[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerpilot"
version = "0.0.0"
description = "PowerPilot local energy workspace for dispatch review and simulation"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Ustinian5" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "openai>=1.59,<2",
  "pydantic>=2.8,<3",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
cloud = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
powerpilot = "powerpilot.api:run"
powerpilot-mcp = "powerpilot.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/powerpilot"]

[tool.hatch.build.targets.wheel.force-include]
"data/opencem/2025-07-a.csv" = "powerpilot/data/opencem/2025-07-a.csv"
"agentteams" = "powerpilot/agentteams"
"THIRD_PARTY_NOTICES.md" = "powerpilot/THIRD_PARTY_NOTICES.md"
"data/SOURCES.md" = "powerpilot/data/SOURCES.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/data", "/agentteams", "/scripts",
  "/pyproject.toml", "/requirements.txt", "/environment.yml", "/Makefile",
  "/.env.example", "/.python-version", "/README.md", "/DEVELOPMENT.md",
  "/ARCHITECTURE.md", "/STATUS.md", "/docs/images", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["powerpilot"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
